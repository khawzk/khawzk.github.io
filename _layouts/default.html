{%- assign t = site.data.i18n[page.lang] | default: site.data.i18n.en -%}
<!doctype html>
<html lang="{{ t.html_lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {% endif %}Mark Khaw</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<meta name="theme-color" content="#F6F3EC">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="alternate" type="application/atom+xml" title="Mark Khaw — Notes" href="{{ '/blog/feed.xml' | relative_url }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231C1B19'/%3E%3Ctext x='16' y='21.5' text-anchor='middle' font-family='system-ui,sans-serif' font-size='15' font-weight='600' fill='%23F6F3EC'%3EMK%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/blog.css' | relative_url }}">
</head>
<body>

<header>
  <nav class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">Mark Khaw</a>
    <div class="links">
      <a class="link-u" href="{{ '/#work' | relative_url }}">Work</a>
      <a class="link-u" href="{{ '/#builds' | relative_url }}">Builds</a>
      <a class="link-u" href="{{ '/#log' | relative_url }}">Path</a>
      <a class="link-u" href="{{ '/blog/' | relative_url }}" aria-current="page">Notes</a>
      <a class="link-u" href="{{ '/#contact' | relative_url }}">Contact</a>
    </div>
  </nav>
</header>

<main>
{{ content }}
</main>

<footer>
  <div class="wrap">
    <a class="mail" href="mailto:zhe991023@gmail.com">zhe991023@gmail.com</a>
    <div class="bottom">
      <div class="social">
        <a href="https://www.linkedin.com/in/mark-khaw/">LinkedIn</a>
        <a href="https://github.com/khawzk">GitHub</a>
        <a href="{{ '/blog/feed.xml' | relative_url }}">RSS</a>
      </div>
      <span>Kuala Lumpur · EN / 中文</span>
    </div>
  </div>
</footer>

</body>
</html>
